<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b1220" />
    </marker>
    <style>
      .box { fill:#fcfcff; stroke:#0b1220; stroke-width:2; rx:10; }
      .cloud { fill:#f1f5f9; stroke:#0b1220; stroke-width:1.5; rx:12; }
      .label { font: 700 15px/1.2 'Segoe UI', Arial, sans-serif; fill:#071023 }
      .sub { font: 400 13px/1.2 'Segoe UI', Arial, sans-serif; fill:#334155 }
      .note { font: 400 12px/1.2 'Segoe UI', Arial, sans-serif; fill:#475569 }
      .arrow { stroke:#0b1220; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="28" y="30" class="label">Auth proxy + ShinyCell2 on Google Cloud Run — architecture</text>

  <!-- Client & Firebase -->
  <g transform="translate(30,60)">
    <rect class="box" x="0" y="0" width="260" height="120"/>
    <text x="18" y="30" class="label">User Browser</text>
    <text x="18" y="56" class="sub">Firebase JS SDK (login UI)</text>
    <text x="18" y="76" class="sub">Obtains idToken from Firebase Auth</text>
  </g>

  <g transform="translate(320,60)">
    <rect class="box" x="0" y="0" width="300" height="120"/>
    <text x="18" y="30" class="label">Firebase Auth (Google)</text>
    <text x="18" y="56" class="sub">Issues ID tokens for users</text>
  </g>

  <!-- Cloud Run region -->
  <g transform="translate(660,40)">
    <rect class="cloud" x="0" y="0" width="660" height="640" rx="16"/>
    <text x="20" y="32" class="label">Google Cloud Run (project)</text>
    <text x="20" y="52" class="note">Services run in an isolated serverless environment; use service accounts and metadata server for identity</text>

    <!-- Auth proxy service -->
    <g transform="translate(24,80)">
      <rect class="box" x="0" y="0" width="420" height="160" rx="10"/>
      <text x="14" y="30" class="label">Auth Proxy (Cloud Run)</text>
      <text x="14" y="56" class="sub">- Verifies user idToken via Firebase Admin</text>
      <text x="14" y="76" class="sub">- Creates session cookie (optional)</text>
      <text x="14" y="96" class="sub">- Forwards upstream requests</text>
    </g>

    <!-- Service account / secrets & metadata -->
    <g transform="translate(470,80)">
      <rect class="box" x="0" y="0" width="150" height="120" rx="8"/>
      <text x="10" y="28" class="label">Service Account</text>
      <text x="10" y="50" class="sub">- Granted to Auth Proxy</text>
      <text x="10" y="70" class="sub">- Secret Manager or built-in IAM</text>
    </g>

    <!-- Identity token provider -->
    <g transform="translate(24,260)">
      <rect class="box" x="0" y="0" width="420" height="100" rx="10"/>
      <text x="14" y="30" class="label">IdentityTokenProvider</text>
      <text x="14" y="56" class="sub">Fetches identity tokens (metadata server) for calling upstream services</text>
    </g>

    <!-- ShinyCell2 service -->
    <g transform="translate(24,380)">
      <rect class="box" x="0" y="0" width="420" height="160" rx="10"/>
      <text x="14" y="30" class="label">ShinyCell2 (Cloud Run)</text>
      <text x="14" y="56" class="sub">- Protected upstream service</text>
      <text x="14" y="76" class="sub">- Accepts requests with identity token or forwarded headers</text>
      <text x="14" y="96" class="sub">- Health checks used by deploy/traffic routing</text>
    </g>

    <!-- Optional Cloud Load Balancer / Ingress -->
    <g transform="translate(470,220)">
      <rect class="box" x="0" y="0" width="150" height="120" rx="8"/>
      <text x="12" y="30" class="label">Load Balancer / Ingress</text>
      <text x="12" y="52" class="sub">Optional: global endpoint, TLS termination</text>
    </g>

  </g>

  <!-- Arrows and annotations outside cloud -->
  <path class="arrow" d="M 260 120 L 320 120" />
  <text x="280" y="115" class="note">OAuth flow (client → Firebase)</text>

  <path class="arrow" d="M 430 120 L 660 140" />
  <text x="500" y="132" class="note">idToken POST → Auth Proxy (Cloud Run)</text>

  <path class="arrow" d="M 520 250 L 520 300" />
  <text x="530" y="276" class="note">Auth Proxy verifies token using Admin SDK</text>

  <path class="arrow" d="M 460 360 L 640 420" />
  <text x="500" y="398" class="note">Auth Proxy requests identity token for ShinyCell2</text>

  <path class="arrow" d="M 320 540 L 640 560" />
  <text x="380" y="555" class="note">Upstream call (with identity token) → ShinyCell2</text>

  <!-- Footer legend -->
  <g transform="translate(30,680)">
    <rect class="box" x="0" y="0" width="1320" height="60" rx="10"/>
    <text x="14" y="24" class="note">Notes: On Cloud Run the Auth Proxy uses a service account (or Secret Manager) for Firebase Admin credentials. IdentityTokenProvider fetches short-lived tokens via the metadata server to authenticate to other Cloud Run services. Use Load Balancer or Cloud Run ingress for TLS and public access.</text>
  </g>

</svg>
